name: robot-release-admin

services:
  release-admin:
    build: .
    image: robot-release-admin:local
    ports:
      - "${HOST_PORT:-5088}:5088"
    environment:
      PORT: "5088"
      DATA_ROOT: /data
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-change-me}
    volumes:
      - ./data:/data
    restart: unless-stopped
